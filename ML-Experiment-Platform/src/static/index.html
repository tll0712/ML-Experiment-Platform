                                        const datasetLabel = context.dataset.label;
                                        const value = context.parsed.y;
                                        const index = context.dataIndex;
                                        const k = kValues[index];
                                        
                                        if (datasetLabel === metricName) {
                                            const std = stdValues[index];
                                            return [
                                                `${datasetLabel}: ${value.toFixed(4)}`,
                                                `标准差: ±${std.toFixed(4)}`,
                                                k === bestK ? '⭐ 最佳K值' : ''
                                            ].filter(Boolean);
                                        } else {
                                            return `${datasetLabel}: ${value.toFixed(4)}`;
                                        }
                                    }
                                }
                            },
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'K值',
                                    font: { size: 12, weight: 'bold' }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: taskType === 'classification' ? '准确率' : 'RMSE',
                                    font: { size: 12, weight: 'bold' }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            }
                        }
                    }
                });
                
                console.log('KNN K值选择曲线图表创建成功');
            } catch (error) {
                console.error('创建KNN K值选择曲线图表失败:', error);
            }
        }
        
        // K-Means肘部法则图渲染函数
        function renderKMeansElbow(elbowData) {
            console.log('开始渲染K-Means肘部法则图', elbowData);
            
            // 重试机制：如果canvas元素还未准备好，等待后重试
            let retryCount = 0;
            const maxRetries = 10;
            
            const tryRender = () => {
                const ctx = document.getElementById('kmeansElbowChart');
                if (!ctx) {
                    if (retryCount < maxRetries) {
                        retryCount++;
                        console.log(`K-Means肘部法则图表容器未找到，等待后重试 (${retryCount}/${maxRetries})...`);
                        setTimeout(tryRender, 100);
                        return;
                    } else {
                        console.warn('K-Means肘部法则图表容器未找到，已重试多次');
                        return;
                    }
                }
                renderChart(ctx, elbowData);
            };
            
            const renderChart = (ctx, elbowData) => {
            
                const kValues = elbowData.k_values || [];
                const inertiaValues = elbowData.inertia_values || [];
                const currentK = elbowData.current_k;
                const bestK = elbowData.best_k || currentK;
                
                console.log('K-Means肘部法则数据:', {
                    kValues: kValues,
                    inertiaValues: inertiaValues,
                    currentK: currentK,
                    bestK: bestK
                });
                
                if (kValues.length === 0 || inertiaValues.length === 0) {
                    console.warn('肘部法则数据为空', { kValues: kValues.length, inertiaValues: inertiaValues.length });
                    return;
                }
                
                // 销毁旧图表
                if (window.kmeansElbowChart) {
                    try {
                        window.kmeansElbowChart.destroy();
                    } catch (e) {
                        console.warn('销毁旧图表失败:', e);
                    }
                }
                
                // 创建图表
                try {
                    window.kmeansElbowChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: kValues.map(k => `K=${k}`),
                            datasets: [{
                                label: 'Inertia（簇内平方和）',
                                data: inertiaValues,
                                borderColor: 'rgba(59, 130, 246, 1)',
                                backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                fill: true,
                                tension: 0.4,
                                pointRadius: function(context) {
                                    const index = context.dataIndex;
                                    const k = kValues[index];
                                    // 当前K值和最佳K值用更大的点
                                    return (k === currentK || k === bestK) ? 8 : 5;
                                },
                                pointHoverRadius: function(context) {
                                    const index = context.dataIndex;
                                    const k = kValues[index];
                                    return (k === currentK || k === bestK) ? 10 : 7;
                                },
                                pointBackgroundColor: function(context) {
                                    const index = context.dataIndex;
                                    const k = kValues[index];
                                    if (k === currentK) return 'rgba(239, 68, 68, 1)';  // 红色表示当前K值
                                    if (k === bestK && k !== currentK) return 'rgba(16, 185, 129, 1)';  // 绿色表示最佳K值
                                    return 'rgba(59, 130, 246, 1)';
                                },
                                pointBorderColor: function(context) {
                                    const index = context.dataIndex;
                                    const k = kValues[index];
                                    if (k === currentK) return 'rgba(239, 68, 68, 1)';
                                    if (k === bestK && k !== currentK) return 'rgba(16, 185, 129, 1)';
                                    return 'rgba(59, 130, 246, 1)';
                                },
                                pointBorderWidth: function(context) {
                                    const index = context.dataIndex;
                                    const k = kValues[index];
                                    return (k === currentK || k === bestK) ? 3 : 2;
                                }
                            }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            title: {
                                display: true,
                                text: `肘部法则图（当前K=${currentK}，建议K=${bestK}）`,
                                font: { size: 14, weight: 'bold' }
                            },
                            legend: {
                                display: true,
                                position: 'top'
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const value = context.parsed.y;
                                        const index = context.dataIndex;
                                        const k = kValues[index];
                                        let label = `K=${k}: Inertia=${value.toFixed(4)}`;
                                        if (k === currentK) {
                                            label += ' (当前K值)';
                                        }
                                        if (k === bestK && k !== currentK) {
                                            label += ' (建议K值)';
                                        }
                                        return label;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: 'K值（聚类数）',
                                    font: { size: 12, weight: 'bold' }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: 'Inertia（簇内平方和）',
                                    font: { size: 12, weight: 'bold' }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            }
                        }
                    }
                });
                
                console.log('K-Means肘部法则图表创建成功');
                } catch (error) {
                    console.error('创建K-Means肘部法则图表失败:', error);
                }
            };
            
            // 开始渲染
            tryRender();
        }

                                },
                                pointBorderWidth: function(context) {

                                pointBackgroundColor: function(context) {

                                pointBorderColor: function(context) {

        // K-Means聚类可视化渲染函数
        function renderKMeansVisualization(kmeansViz) {
            console.log('开始渲染K-Means可视化', kmeansViz);
            
            // 重试机制：如果canvas元素还未准备好，等待后重试
            let retryCount = 0;
            const maxRetries = 10;
            
            const tryRender = () => {
                const ctx = document.getElementById('kmeansChart2D');
                if (!ctx) {
                    if (retryCount < maxRetries) {
                        retryCount++;
                        console.log(`K-Means图表容器未找到，等待后重试 (${retryCount}/${maxRetries})...`);
                        setTimeout(tryRender, 100);
                        return;
                    } else {
                        console.warn('K-Means图表容器未找到，已重试多次');
                        return;
                    }
                }
                
                if (!kmeansViz.data_points || !kmeansViz.labels) {
                    console.warn('K-Means数据不完整', {
                        hasDataPoints: !!kmeansViz.data_points,
                        hasLabels: !!kmeansViz.labels
                    });
                    return;
                }
                
                renderChart(ctx, kmeansViz);
            };
            
            const renderChart = (ctx, kmeansViz) => {
                const dataPoints = kmeansViz.data_points;
                const labels = kmeansViz.labels;
                const centroids = kmeansViz.centroids || [];
            
            // 获取唯一的聚类标签
            const uniqueLabels = [...new Set(labels)];
            const colors = [
                'rgba(59, 130, 246, 0.6)', 'rgba(16, 185, 129, 0.6)', 'rgba(239, 68, 68, 0.6)',
                'rgba(245, 158, 11, 0.6)', 'rgba(79, 195, 247, 0.6)', 'rgba(236, 72, 153, 0.6)',
                'rgba(14, 165, 233, 0.6)', 'rgba(251, 146, 60, 0.6)'
            ];
            
            const datasets = [];
            
            // 为每个聚类创建数据集
            uniqueLabels.forEach((label, idx) => {
                const clusterPoints = dataPoints.filter((_, i) => labels[i] === label);
                datasets.push({
                    label: `簇 ${label}`,
                    data: clusterPoints.map(p => ({x: p[0], y: p[1] || 0})),
                    backgroundColor: colors[idx % colors.length],
                    borderColor: colors[idx % colors.length].replace('0.6', '1'),
                    pointRadius: 4,
                    pointHoverRadius: 6
                });
            });
            
            // 添加聚类中心点
            if (centroids.length > 0) {
                datasets.push({
                    label: '聚类中心',
                    data: centroids.map(c => ({x: c[0], y: c[1]})),
                    backgroundColor: 'rgba(0, 0, 0, 1)',
                    borderColor: 'rgba(0, 0, 0, 1)',
                    pointRadius: 8,
                    pointHoverRadius: 10,
                    pointStyle: 'star'
                });
            }
            
                const featureNames = kmeansViz.feature_names || ['特征1', '特征2'];
                
                // 销毁旧图表
                if (window.kmeansChart2D) {
                    try {
                        window.kmeansChart2D.destroy();
                    } catch (e) {
                        console.warn('销毁旧K-Means图表失败:', e);
                    }
                }
                
                try {
                    window.kmeansChart2D = new Chart(ctx, {
                type: 'scatter',
                data: { datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        title: {
                            display: true,
                            text: 'K-Means聚类结果可视化',
                            font: { size: 14, weight: 'bold' }
                        },
                        legend: { display: true, position: 'right' }
                    },
                    scales: {
                        x: {
                            title: {
                                display: true,
                                text: featureNames[0] || '特征1',
                                font: { size: 11, weight: 'bold' }
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: featureNames[1] || '特征2',
                                font: { size: 11, weight: 'bold' }
                            }
                        }
                    }
                }
                });
                console.log('K-Means图表创建成功');
            } catch (error) {
                console.error('创建K-Means图表失败:', error);
            }
        };
        
        tryRender();
    }

        // 特征重要性可视化渲染函数 - 使用Chart.js水平条形图
        function renderFeatureImportanceChart(data) {
            const ctx = document.getElementById('featureImportanceChart');
            if (!ctx || !data || !data.labels || !data.values) return;
            
            // 数据已经按重要性从高到低排序，不需要反转
            const labels = data.labels;
            const values = data.values;
            
            // 根据重要性值生成渐变色
            const maxValue = Math.max(...values);
            const colors = values.map((val, idx) => {
                const ratio = val / maxValue;
                // 前三名使用特殊颜色，其他使用渐变的蓝色
                // idx === 0 是第一名（最重要的），idx === 1 是第二名，idx === 2 是第三名
                if (idx === 0) {
                    // 第一名：金色渐变
                    return 'rgba(251, 191, 36, 0.8)';
                } else if (idx === 1) {
                    // 第二名：银色渐变
                    return 'rgba(203, 213, 225, 0.8)';
                } else if (idx === 2) {
                    // 第三名：铜色渐变
                    return 'rgba(180, 83, 9, 0.8)';
                } else {
                    // 其他：蓝色渐变，根据重要性调整透明度
                    const alpha = 0.5 + (ratio * 0.5);
                    return `rgba(59, 130, 246, ${alpha})`;
                }
            });
            
            const borderColors = values.map((val, idx) => {
                if (idx === 0) {
                    return 'rgba(251, 191, 36, 1)';
                } else if (idx === 1) {
                    return 'rgba(203, 213, 225, 1)';
                } else if (idx === 2) {
                    return 'rgba(180, 83, 9, 1)';
                } else {
                    return 'rgba(59, 130, 246, 1)';
                }
            });
            
            // 创建自定义插件来显示数据标签（不使用外部插件，避免兼容性问题）
            const dataLabelPlugin = {
                id: 'featureImportanceLabels',
                afterDatasetsDraw(chart) {
                    const {ctx, chartArea: {left, right, top, bottom}, scales: {x, y}} = chart;
                    ctx.save();
                    
                    chart.data.datasets.forEach((dataset, datasetIndex) => {
                        const meta = chart.getDatasetMeta(datasetIndex);
                        meta.data.forEach((bar, index) => {
                            const value = dataset.data[index];
                            const labelText = value.toFixed(1) + '%';
                            
                            // 计算标签位置（条形图右侧）
                            const xPos = x.getPixelForValue(value) + 10;
                            const yPos = bar.y;
                            
                            // 根据背景色调整文字颜色
                            let textColor;
                            if (index === 0) {
                                textColor = '#92400E'; // 金色背景用深色文字
                            } else if (index === 1) {
                                textColor = '#475569'; // 银色背景用深色文字
                            } else if (index === 2) {
                                textColor = '#FFFFFF'; // 铜色背景用白色文字
                            } else {
                                textColor = '#1E293B'; // 蓝色背景用深色文字
                            }
                            
                            // 绘制文本
                            ctx.fillStyle = textColor;
                            ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(labelText, xPos, yPos);
                        });
                    });
                    
                    ctx.restore();
                }
            };
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '重要性 (%)',
                        data: values,
                        backgroundColor: colors,
                        borderColor: borderColors,
                        borderWidth: 2,
                        borderRadius: 4
                    }]
                },
                plugins: [dataLabelPlugin],
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const value = context.parsed.x;
                                    const rank = context.dataIndex + 1;
                                    let rankText = '';
                                    if (rank === 1) rankText = ' 🥇';
                                    else if (rank === 2) rankText = ' 🥈';
                                    else if (rank === 3) rankText = ' 🥉';
                                    return `重要性: ${value.toFixed(2)}%${rankText}`;
                                }
                            },
                            backgroundColor: 'rgba(0, 0, 0, 0.8)',
                            padding: 12,
                            titleFont: { size: 14, weight: 'bold' },
                            bodyFont: { size: 13 },
                            cornerRadius: 6
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            max: Math.max(...values) * 1.15,
                            title: {
                                display: true,
                                text: '重要性 (%)',
                                font: { size: 13, weight: 'bold' },
                                color: '#334155'
                            },
                            grid: {
                                color: 'rgba(226, 232, 240, 0.5)'
                            },
                            ticks: {
                                font: { size: 12 },
                                color: '#64748B',
                                callback: function(value) {
                                    return value.toFixed(1) + '%';
                                }
                            }
                        },
                        y: {
                            reverse: false,
                            title: {
                                display: true,
                                text: '特征',
                                font: { size: 13, weight: 'bold' },
                                color: '#334155'
                            },
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: { size: 12 },
                                color: '#1E293B',
                                maxRotation: 0,
                                autoSkip: false
                            }
                        }
                    },
                    animation: {
                        duration: 1000,
                        easing: 'easeOutQuart'
                    }
                }
            });
        }
