        // 将Canvas转换为图片Base64
        function canvasToBase64(canvasId) {
            try {
                const canvas = document.getElementById(canvasId);
                if (!canvas) {
                    console.warn(`Canvas元素不存在: ${canvasId}`);
                    return null;
                }
                
                // 检查canvas是否有内容（宽度和高度）
                if (canvas.width === 0 || canvas.height === 0) {
                    console.warn(`Canvas尺寸为0: ${canvasId}`);
                    return null;
                }
                
                // Chart.js的canvas可能包含多个chart实例，需要找到对应的chart
                const chart = Chart.getChart(canvas);
                if (chart) {
                    // 如果canvas上有chart实例，使用chart的方法
                    try {
                        const base64 = chart.toBase64Image('image/png', 1.0);
                        // 验证Base64数据是否有效
                        if (base64 && base64.startsWith('data:image')) {
                            return base64;
                        } else {
                            console.warn(`Chart ${canvasId} 返回的Base64数据无效`);
                            // 尝试直接转换canvas
                            return canvas.toDataURL('image/png', 1.0);
                        }
                    } catch (chartError) {
                        console.warn(`Chart.toBase64Image失败 ${canvasId}:`, chartError);
                        // 降级到直接转换canvas
                        return canvas.toDataURL('image/png', 1.0);
                    }
                } else {
                    // 没有chart实例，直接转换canvas
                    const dataUrl = canvas.toDataURL('image/png', 1.0);
                    // 检查是否是有效的图片数据
                    if (dataUrl && dataUrl.length > 100) { // 最小有效Base64长度
                        return dataUrl;
                    } else {
                        console.warn(`Canvas ${canvasId} 数据无效`);
                        return null;
                    }
                }
            } catch (error) {
                console.warn(`无法转换Canvas ${canvasId}:`, error);
                return null;
            }
        }
        
        // 将SVG转换为图片Base64
        function svgToBase64(svgElement) {
            try {
                if (!svgElement) return Promise.resolve(null);
                
                // 克隆SVG以避免修改原始元素
                const clonedSvg = svgElement.cloneNode(true);
                
                // 获取SVG的实际尺寸
                const bbox = svgElement.getBBox();
                const viewBox = svgElement.getAttribute('viewBox');
                let width = svgElement.width?.baseVal?.value || svgElement.getAttribute('width');
                let height = svgElement.height?.baseVal?.value || svgElement.getAttribute('height');
                
                // 如果没有明确宽高，从viewBox获取
                if (!width || !height) {
                    if (viewBox) {
                        const vb = viewBox.split(' ');
                        width = vb[2] || bbox.width || 800;
                        height = vb[3] || bbox.height || 600;
                    } else {
                        width = bbox.width || 800;
                        height = bbox.height || 600;
                    }
                }
                
                // 确保宽高是数字
                width = parseFloat(width) || 800;
                height = parseFloat(height) || 600;
                
                // 设置SVG的宽高属性（如果没有）
                if (!clonedSvg.getAttribute('width')) {
                    clonedSvg.setAttribute('width', width);
                }
                if (!clonedSvg.getAttribute('height')) {
                    clonedSvg.setAttribute('height', height);
                }
                
                // 创建图片
                const svgData = new XMLSerializer().serializeToString(clonedSvg);
                const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
                const url = URL.createObjectURL(svgBlob);
                
                // 创建临时canvas来转换
                return new Promise((resolve) => {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        // 使用SVG的实际尺寸或图片尺寸
                        canvas.width = width || img.width || 800;
                        canvas.height = height || img.height || 600;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = 'white';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const base64 = canvas.toDataURL('image/png');
                        URL.revokeObjectURL(url);
                        resolve(base64);
                    };
                    img.onerror = () => {
                        URL.revokeObjectURL(url);
                        resolve(null);
                    };
                    img.src = url;
                });
            } catch (error) {
                console.warn('SVG转换失败:', error);
                return Promise.resolve(null);
            }
        }
        
        // 收集所有图表图片（返回Promise，但也可以同步调用）
        function collectChartImages() {
            const images = {};
            const chartCanvasIds = [
                'rocChart', 'prChart',
                'featureImportanceChart',
                'lossChart', 'accuracyChart', 'secondDerivativeChart', 'gradientNormChart', 'weightNormChart',
                'hyperparameter-heatmap',
                'actualVsPredictedChart', 'residualVsPredictedChart', 'residualDistributionChart',
                'coefficientsChart',
                'probabilityDistributionChart'
            ];
            
            // 收集所有Canvas图表
            chartCanvasIds.forEach(id => {
                const base64 = canvasToBase64(id);
                if (base64) {
                    images[id] = base64;
                }
            });
            
            // 收集逻辑回归系数图表（可能有多个，最多检查10个）
            let idx = 0;
            let maxChecks = 10; // 最多检查10个逻辑回归系数图表
            while (idx < maxChecks) {
                const id = `logisticCoeffChart_${idx}`;
                const canvas = document.getElementById(id);
                if (canvas) {
                    // 检查是否有Chart实例
                    const chart = Chart.getChart(canvas);
                    if (chart) {
                        const base64 = canvasToBase64(id);
                        if (base64) {
                            images[id] = base64;
                            console.log(`✅ 收集到逻辑回归系数图表 ${idx}`);
                        } else {
                            console.warn(`⚠️ 逻辑回归系数图表 ${idx} 转换失败`);
                        }
                    } else {
                        // 如果没有chart实例，可能是还没渲染，但继续检查下一个
                        console.log(`⏳ 逻辑回归系数图表 ${idx} 尚未渲染`);
                    }
                    idx++;
                } else {
                    // 如果没有找到canvas，可能已经检查完所有图表
                    break;
                }
            }
            
            // 收集PCA相关图表
            const pcaCanvasIds = [
                'pca-scatter-2d',
                'pca-scatter-3d-view',
                'pca-cumulative-variance'
            ];
            
            pcaCanvasIds.forEach(id => {
                const base64 = canvasToBase64(id);
                if (base64) {
                    images[id] = base64;
                }
            });
            
            // 收集PCA loadings图表（可能有多个）
            let pcaIdx = 0;
            while (true) {
                const id = `pca-loadings-${pcaIdx}`;
                const base64 = canvasToBase64(id);
                if (base64) {
                    images[id] = base64;
                    pcaIdx++;
                } else {
                    break;
                }
            }
            
            return images;
        }

        // 生成超参数HTML
        function generateHyperparameterHTML(tuning) {
            if (!tuning.best_params) return '';
            
            let html = `
        <section>
            <h2>⚙️ 超参数调优</h2>
            <div class="info-card">
                <h3>最佳参数</h3>

                html += `${key}: ${value}\n`;

            html += `</div>
            </div>`;
            
            if (tuning.best_score !== undefined) {
                html += `
            <div class="info-item" style="margin-top: 15px;">
                <span class="info-label">最佳得分</span>
                <span class="info-value">${(tuning.best_score * 100).toFixed(2)}%</span>
            </div>`;
            }
            
            html += `</section>`;
            return html;

        // 生成特征重要性HTML
        function generateFeatureImportanceHTML(results) {
            const importance = results.feature_importance || [];
            const featureNames = results.processed_feature_names || [];
            
            if (importance.length === 0) return '';

                    if (results.train_metrics.mse) md += `| MSE | ${results.train_metrics.mse.toFixed(4)} | ${results.test_metrics.mse.toFixed(4)} |\n`;
                    if (results.train_metrics.mae) md += `| MAE | ${results.train_metrics.mae.toFixed(4)} | ${results.test_metrics.mae.toFixed(4)} |\n`;

                    md += `**最佳得分**: ${(results.hyperparameter_tuning.best_score * 100).toFixed(2)}%\n\n`;

                md += `|------|----------|--------|\n`;

    // 子导航：动态生成并滚动联动
    function buildVizSubnav(results) {
        const subnav = document.getElementById('vizSubnav');
        if (!subnav) return;
        const sections = [];
        const exists = (id) => !!document.getElementById(id);

        // 映射：id -> 文案（按显示优先级排序）
        // 注意：实验概览已移至固定摘要区域，不再出现在导航栏
        const candidates = [
            ['metricsSection', '📊 性能指标'],
            ['preprocessingSection', '🔧 数据预处理'],
            ['confusionSection', '📋 混淆矩阵'],
            ['rocSection', '📈 ROC/PR曲线'],
            ['thresholdSection', '🎚️ 动态阈值调整'],
            ['logisticCoefficientsSection', '📊 逻辑回归系数'],
            ['naiveBayesVisualizationSection', '📊 朴素贝叶斯可视化'],
            ['knnKSelectionSection', '📊 K值选择曲线'],
            ['kmeansElbowSection', '📊 肘部法则图'],
            ['learningCurveSection', '📈 学习曲线'],
            ['svmDecisionBoundarySection', '🎯 SVM决策边界'],
            ['actualVsPredictedSection', '📊 预测散点图'],
            ['residualAnalysisSection', '📈 残差分析'],
            ['coefficientsSection', '📊 回归系数'],
            ['featureImportanceSection', '⭐ 特征重要性'],
            ['treeVizSection', '🌳 决策树可视化'],
            ['kmeansVizSection', '🎯 聚类可视化'],
            ['kmeansStatsSection', '📊 聚类统计'],
            ['pcaVizSection', '📉 PCA可视化'],
            ['trainingProcessSection', '📈 训练过程'],
            ['tuningSection', '⚙️ 超参调优'],
        ];

        // 根据DOM是否存在决定显示
        candidates.forEach(([id, label]) => { if (exists(id)) sections.push({id, label}); });

        if (sections.length === 0) { 
            subnav.style.display = 'none'; 
            subnav.innerHTML = ''; 
            return; 
        }

        // 添加"全部显示"选项
        sections.unshift({id: 'allSections', label: '👁️ 全部显示'});

        // 生成导航栏HTML，在特定位置添加分隔符
        let navHTML = '';
        const dividerHTML = '<div class="viz-divider"></div>';
        
        // 定义分组边界（在这些ID之前添加分隔符）
        const groupBoundaries = ['actualVsPredictedSection', 'featureImportanceSection', 'trainingProcessSection'];
        let lastWasBoundary = false;
        
        sections.forEach((s, index) => {
            // 在分组边界前添加分隔符（但不在第一个项目前）
            if (index > 0 && groupBoundaries.includes(s.id) && !lastWasBoundary) {
                navHTML += dividerHTML;
            }
            
            navHTML += `<button class="viz-chip" data-target="${s.id}">${s.label}</button>`;
            
            lastWasBoundary = groupBoundaries.includes(s.id);
        });
        
        subnav.innerHTML = navHTML;
        subnav.style.display = 'flex';

        // 获取所有结果卡片
        const allCards = document.querySelectorAll('#resultsContent .result-card');
        
        // 默认显示第一个内容卡片（通常是性能指标），隐藏其他
        if (sections.length > 1) {
            // 隐藏所有卡片
            allCards.forEach(card => card.classList.add('hidden-section'));
            
            // 激活第一个实际的内容按钮（跳过"全部显示"按钮）
            const firstContentChip = subnav.querySelector('.viz-chip[data-target]:not([data-target="allSections"])');
            if (firstContentChip) {
                firstContentChip.classList.add('active');
                // 显示对应的卡片
                const targetId = firstContentChip.dataset.target;
                const target = document.getElementById(targetId);
                if (target) {
                    target.classList.remove('hidden-section');
                }
            }
        }

        // 点击切换显示
        subnav.querySelectorAll('.viz-chip').forEach(btn => {
            btn.addEventListener('click', () => {
                const targetId = btn.dataset.target;
                
                // 移除所有激活状态
                subnav.querySelectorAll('.viz-chip').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');

                if (targetId === 'allSections') {
                    // 显示所有卡片
                    allCards.forEach(card => card.classList.remove('hidden-section'));
                } else {
                    // 隐藏所有卡片
                    allCards.forEach(card => card.classList.add('hidden-section'));
                    // 显示目标卡片（不滚动页面，直接切换）
                    const target = document.getElementById(targetId);
                    if (target) {
                        target.classList.remove('hidden-section');
                    }
                }
            });
        });
    }

    // 根据卡片标题自动标记区块ID，供子导航锚点使用
    function tagResultSections() {
        const cards = document.querySelectorAll('#resultsContent .result-card');
        cards.forEach(card => {
            const titleEl = card.querySelector('h3');
            if (!titleEl) return;
            const text = titleEl.textContent || '';
            let id = '';
            // 优先检查是否已有ID，如果有就不覆盖
            if (card.id) return;
            // 实验概览已移至固定摘要区域，不再需要ID标记
            if (/^📊\s*性能指标$/.test(text.trim()) || /性能指标/.test(text)) id = 'metricsSection';
            else if (/(训练.*测试.*指标|训练.*测试|指标对比)/.test(text)) id = 'metricsSection';
            else if (/数据预处理|预处理信息|preprocessing/i.test(text)) id = 'preprocessingSection';
            else if (/混淆矩阵/.test(text)) id = 'confusionSection';
            else if (/(ROC|PR|曲线)/i.test(text)) id = 'rocSection';
            else if (/动态阈值|阈值调整|threshold/i.test(text)) id = 'thresholdSection';
            else if (/逻辑回归系数/i.test(text)) id = 'logisticCoefficientsSection';
            else if (/朴素贝叶斯可视化/i.test(text)) id = 'naiveBayesVisualizationSection';
            else if (/K值选择|K.*选择曲线/i.test(text)) id = 'knnKSelectionSection';
            else if (/肘部法则|elbow/i.test(text)) id = 'kmeansElbowSection';
            else if (/学习曲线|learning.*curve/i.test(text)) id = 'learningCurveSection';
            else if (/SVM决策边界|决策边界/i.test(text)) id = 'svmDecisionBoundarySection';
            else if (/特征重要性|Feature Importance/i.test(text)) id = 'featureImportanceSection';
            else if (/决策树/.test(text)) id = 'treeVizSection';
            else if (/聚类结果分析|聚类统计/i.test(text)) id = 'kmeansStatsSection';
            else if (/聚类结果可视化|聚类可视化/i.test(text)) id = 'kmeansVizSection';
            else if (/PCA/.test(text)) id = 'pcaVizSection';
            else if (/训练过程|训练曲线|Loss|Accuracy/i.test(text)) id = 'trainingProcessSection';
            else if (/超参数调优/.test(text)) id = 'tuningSection';
            if (id) card.id = id;
        });
    }

        // 决策树可视化渲染函数
        function renderDecisionTree(treeData) {
            const container = document.getElementById('tree-svg-container');
            if (!container || !treeData) return;
            
            // 清空容器
            container.innerHTML = '';
            
            // 获取容器尺寸
            const containerRect = container.getBoundingClientRect();
            const containerWidth = Math.max(800, containerRect.width || 1000);
            const containerHeight = Math.max(500, containerRect.height || 600);
            
            // 计算树的高度和宽度
            function getTreeSize(node) {
                if (!node) return { width: 0, height: 0 };
                if (node.type === 'leaf') return { width: 1, height: 1 };
                const left = getTreeSize(node.left);
                const right = getTreeSize(node.right);
                return {
                    width: left.width + right.width,
                    height: Math.max(left.height, right.height) + 1
                };
            }
            
            const treeSize = getTreeSize(treeData);
            const nodeWidth = 160;
            const nodeHeight = 90;
            const horizontalSpacing = 50;
            const verticalSpacing = 120;
            
            const svgWidth = Math.max(containerWidth, treeSize.width * (nodeWidth + horizontalSpacing) + 100);
            const svgHeight = Math.max(containerHeight, treeSize.height * (nodeHeight + verticalSpacing) + 100);
            
            // 创建SVG
            const svg = d3.select('#tree-svg-container')
                .append('svg')
                .attr('width', '100%')
                .attr('height', '100%')
                .attr('viewBox', `0 0 ${svgWidth} ${svgHeight}`)
                .style('background', '#FFFFFF');
            
            const g = svg.append('g');
            
            // 缩放控制
            let currentTransform = d3.zoomIdentity;
            const zoom = d3.zoom()
                .scaleExtent([0.3, 3])
                .on('zoom', function(event) {
                    currentTransform = event.transform;
                    g.attr('transform', event.transform);
                });
            
            svg.call(zoom);
            
            // 初始化视图到中心
            const initialScale = Math.min(
                (containerWidth - 100) / svgWidth,
                (containerHeight - 100) / svgHeight,
                1
            );
            const initialX = (containerWidth - svgWidth * initialScale) / 2;
            const initialY = 50;
            currentTransform = d3.zoomIdentity.translate(initialX, initialY).scale(initialScale);
            g.attr('transform', currentTransform);
            
            // 缩放按钮
            document.getElementById('tree-zoom-in')?.addEventListener('click', () => {
                currentTransform = currentTransform.scale(1.2);
                svg.transition().duration(300).call(zoom.transform, currentTransform);
            });
            
            document.getElementById('tree-zoom-out')?.addEventListener('click', () => {
                currentTransform = currentTransform.scale(1/1.2);
                svg.transition().duration(300).call(zoom.transform, currentTransform);
            });
            
            document.getElementById('tree-reset')?.addEventListener('click', () => {
                const resetTransform = d3.zoomIdentity.translate(initialX, initialY).scale(initialScale);
                currentTransform = resetTransform;
                svg.transition().duration(300).call(zoom.transform, resetTransform);
            });
            
            // 计算节点位置
            function calculatePositions(node, x, y, depth) {
                if (!node) return;
                node.x = x;
                node.y = y;
                node.depth = depth;
                
                if (node.type === 'internal') {
                    const leftWidth = node.left ? getTreeSize(node.left).width : 0;
                    const rightWidth = node.right ? getTreeSize(node.right).width : 0;
                    const totalWidth = Math.max(1, leftWidth + rightWidth);
                    
                    if (node.left) {
                        const leftX = x - (totalWidth * (nodeWidth + horizontalSpacing)) / 2 + 
                                     (leftWidth * (nodeWidth + horizontalSpacing)) / 2;
                        calculatePositions(node.left, leftX, y + verticalSpacing, depth + 1);
                    }
                    if (node.right) {
                        const rightX = x + (totalWidth * (nodeWidth + horizontalSpacing)) / 2 - 
                                      (rightWidth * (nodeWidth + horizontalSpacing)) / 2;
                        calculatePositions(node.right, rightX, y + verticalSpacing, depth + 1);
                    }
                }
            }
            
            calculatePositions(treeData, svgWidth / 2, 80, 0);
            
            // 创建渐变定义（只创建一次）
            const defs = svg.append('defs');
            const internalGradient = defs.append('linearGradient')
                .attr('id', 'internalNodeGradient')
                .attr('x1', '0%').attr('y1', '0%')
                .attr('x2', '0%').attr('y2', '100%');
            internalGradient.append('stop').attr('offset', '0%').attr('stop-color', '#4FC3F7');
            internalGradient.append('stop').attr('offset', '100%').attr('stop-color', '#29B6F6');
            
            const leafGradient = defs.append('linearGradient')
                .attr('id', 'leafNodeGradient')
                .attr('x1', '0%').attr('y1', '0%')
                .attr('x2', '0%').attr('y2', '100%');
            leafGradient.append('stop').attr('offset', '0%').attr('stop-color', '#10B981');
            leafGradient.append('stop').attr('offset', '100%').attr('stop-color', '#059669');
            
            // 绘制连接线
            function drawLinks(node) {
                if (!node || node.type === 'leaf') return;
                
                if (node.left) {
                    g.append('line')
                        .attr('x1', node.x)
                        .attr('y1', node.y + nodeHeight / 2)
                        .attr('x2', node.left.x)
                        .attr('y2', node.left.y)
                        .attr('stroke', '#64748B')
                        .attr('stroke-width', 2);
                    drawLinks(node.left);
                }
                if (node.right) {
                    g.append('line')
                        .attr('x1', node.x)
                        .attr('y1', node.y + nodeHeight / 2)
                        .attr('x2', node.right.x)
                        .attr('y2', node.right.y)
                        .attr('stroke', '#64748B')
                        .attr('stroke-width', 2);
                    drawLinks(node.right);
                }
                
                // 添加条件标签
                if (node.left) {
                    g.append('text')
                        .attr('x', (node.x + node.left.x) / 2)
                        .attr('y', (node.y + nodeHeight / 2 + node.left.y) / 2 - 5)
                        .attr('text-anchor', 'middle')
                        .attr('font-size', '11px')
                        .attr('font-weight', '600')
                        .attr('fill', '#4FC3F7')
                        .attr('stroke', '#FFFFFF')
                        .attr('stroke-width', '3px')
                        .attr('paint-order', 'stroke')
                        .text('≤');
                }
                if (node.right) {
                    g.append('text')
                        .attr('x', (node.x + node.right.x) / 2)
                        .attr('y', (node.y + nodeHeight / 2 + node.right.y) / 2 - 5)
                        .attr('text-anchor', 'middle')
                        .attr('font-size', '11px')
                        .attr('font-weight', '600')
                        .attr('fill', '#4FC3F7')
                        .attr('stroke', '#FFFFFF')
                        .attr('stroke-width', '3px')
                        .attr('paint-order', 'stroke')
                        .text('>');
                }
            }
            
            drawLinks(treeData);
            
            // 绘制节点
            function drawNode(node) {
                if (!node) return;
                
                const nodeGroup = g.append('g')
                    .attr('transform', `translate(${node.x}, ${node.y})`)
                    .style('cursor', 'default');
                
                // 节点背景
                const nodeBox = nodeGroup.append('rect')
                    .attr('width', nodeWidth)
                    .attr('height', nodeHeight)
                    .attr('x', -nodeWidth / 2)
                    .attr('y', -nodeHeight / 2)
                    .attr('rx', 8)
                    .attr('ry', 8)
                    .attr('fill', node.type === 'internal' ? 'url(#internalNodeGradient)' : 'url(#leafNodeGradient)')
                    .attr('stroke', node.type === 'internal' ? '#0284C7' : '#059669')
                    .attr('stroke-width', 2.5)
                    .style('filter', 'drop-shadow(0 2px 4px rgba(0,0,0,0.15))');
                
                if (node.type === 'internal') {
                    // 内部节点：显示特征和阈值
                    nodeGroup.append('text')
                        .attr('text-anchor', 'middle')
                        .attr('y', -25)
                        .attr('font-size', '12px')
                        .attr('font-weight', '600')
                        .attr('fill', '#FFFFFF')
                        .text((node.feature || 'Feature').length > 12 ? (node.feature || 'Feature').substring(0, 12) + '...' : (node.feature || 'Feature'));
                    
                    nodeGroup.append('text')
                        .attr('text-anchor', 'middle')
                        .attr('y', 5)
                        .attr('font-size', '15px')
                        .attr('font-weight', '700')
                        .attr('fill', '#FFFFFF')
                        .text('≤ ' + parseFloat(node.threshold).toFixed(3));
                    
                    if (node.samples) {
                        nodeGroup.append('text')
                            .attr('text-anchor', 'middle')
                            .attr('y', 28)
                            .attr('font-size', '10px')
                            .attr('fill', 'rgba(255,255,255,0.9)')
                            .text(`样本: ${node.samples}`);
                    }
                } else {
                    // 叶节点：显示类别和样本数
                    nodeGroup.append('text')
                        .attr('text-anchor', 'middle')
                        .attr('y', -15)
                        .attr('font-size', '13px')
                        .attr('font-weight', '700')
                        .attr('fill', '#FFFFFF')
                        .text('类别: ' + (node.class || 'Unknown'));
                    
                    if (node.samples) {
                        nodeGroup.append('text')
                            .attr('text-anchor', 'middle')
                            .attr('y', 8)
                            .attr('font-size', '11px')
                            .attr('fill', 'rgba(255,255,255,0.95)')
                            .text(`样本: ${node.samples}`);
                    }
                    
                    if (node.class_counts && Object.keys(node.class_counts).length > 0) {
                        const counts = Object.entries(node.class_counts).map(([k, v]) => `${k}:${v}`).join(', ');
                        const displayText = counts.length > 30 ? counts.substring(0, 30) + '...' : counts;
                        nodeGroup.append('text')
                            .attr('text-anchor', 'middle')
                            .attr('y', 30)
                            .attr('font-size', '9px')
                            .attr('fill', 'rgba(255,255,255,0.85)')
                            .text(displayText);
                    }
                }
                
                // 递归绘制子节点
                if (node.left) drawNode(node.left);
                if (node.right) drawNode(node.right);
            }
            
            drawNode(treeData);
        }

        // PCA可视化渲染函数
        function renderPCAVisualization(results) {

                hasTransformedData: !!results.pca_transformed_data,

                hasComponents: !!results.pca_components
            });
            
            // 重试机制：等待所有canvas元素准备好
            let retryCount = 0;
            const maxRetries = 15;
            
            const tryRender = () => {
                const ctx2d = document.getElementById('pca-scatter-2d');
                const ctx3d = document.getElementById('pca-scatter-3d-view');
                const ctxCumulative = document.getElementById('pca-cumulative-variance');
                
                // 检查需要的canvas元素是否都已准备好

                const needs3D = needs2D && results.pca_transformed_data[0] && results.pca_transformed_data[0].length >= 3;
                const needsCumulative = !!results.cumulative_variance_ratio;
                const needsLoadings = results.pca_components && results.pca_components.length > 0;
                
                const allReady = (!needs2D || ctx2d) && 
                                (!needs3D || ctx3d) && 
                                (!needsCumulative || ctxCumulative);
                
                if (!allReady && retryCount < maxRetries) {
                    retryCount++;
                    console.log(`PCA图表容器未完全准备好，等待后重试 (${retryCount}/${maxRetries})...`);
                    setTimeout(tryRender, 100);
                    return;

                if (!allReady) {
                    console.warn('PCA图表容器未准备好，已重试多次');

                    render2DScatter(ctx2d, results);

                    render3DScatter(ctx3d, results);

                // 累积方差贡献图

        // 超参数热力图渲染函数
        function renderHyperparameterHeatmap(heatmapData) {
            const ctx = document.getElementById('hyperparameter-heatmap');
            if (!ctx || !heatmapData || !heatmapData.scores) return;
            
            // Chart.js不直接支持热力图，我们使用条形图的堆叠来模拟
            // 准备数据
            const labels = heatmapData.param1_values;
            const datasets = heatmapData.param2_values.map((p2Val, idx) => ({
                label: `${heatmapData.param2_name} = ${p2Val}`,
                data: heatmapData.scores[idx],
                backgroundColor: heatmapData.scores[idx].map(score => {
                    // 根据分数计算颜色强度（0-1范围）
                    const normalizedScore = Math.max(0, Math.min(1, score));
                    const hue = 200 + (1 - normalizedScore) * 60; // 蓝色到青色
                    return `hsla(${hue}, 70%, 60%, ${0.5 + normalizedScore * 0.5})`;
                }),
                borderColor: heatmapData.scores[idx].map(score => {
                    const normalizedScore = Math.max(0, Math.min(1, score));
                    return `rgba(59, 130, 246, ${0.8})`;
                }),
                borderWidth: 1
            }));
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: datasets
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: {
                            display: true,
                            text: `${heatmapData.param1_name} vs ${heatmapData.param2_name} 参数性能对比`,
                            font: { size: 14, weight: 'bold' }
                        },
                            legend: {
                                display: true,
                            position: 'right'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const score = context.parsed.y;
                                    return `得分: ${(score * 100).toFixed(2)}%`;
                                }
                            }
                            }
                        },
                        scales: {
                            x: {
                            stacked: false,
                                title: {
                                    display: true,
                                text: heatmapData.param1_name
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: '交叉验证得分'
                            },
                            min: 0,
                            max: 1
                        }
                    }
                }
            });
        }

        // 渲染回归可视化
        function renderRegressionVisualization(regViz, results) {
            // 1. 实际值 vs 预测值散点图
            const actualVsPredictedCtx = document.getElementById('actualVsPredictedChart');
            if (actualVsPredictedCtx) {
                const yTrue = regViz.y_true_test;
                const yPred = regViz.y_pred_test;
                
                // 计算对角线范围（y=x）
                const allValues = [...yTrue, ...yPred];
                const minVal = Math.min(...allValues);
                const maxVal = Math.max(...allValues);
                
                new Chart(actualVsPredictedCtx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: '测试集',
                            data: yTrue.map((val, idx) => ({x: val, y: yPred[idx]})),
                            backgroundColor: 'rgba(59, 130, 246, 0.6)',
                            borderColor: 'rgba(59, 130, 246, 1)',
                            borderWidth: 1,
                            pointRadius: 4
                        }, {
                            label: '理想线 (y=x)',
                            data: [[minVal, minVal], [maxVal, maxVal]],
                            type: 'line',
                            borderColor: 'rgba(239, 68, 68, 1)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0,
                            tension: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            title: {
                                display: false
                            },
                            legend: {
                                display: true,
                                position: 'top'
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        if (context.datasetIndex === 0) {
                                            return `实际值: ${context.parsed.x.toFixed(4)}, 预测值: ${context.parsed.y.toFixed(4)}`;
                                        }
                                        return null;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: '实际值',
                                    font: { size: 12, weight: 'bold' }
                                },
                                min: minVal,
                                max: maxVal
                            },
                            y: {
                                title: {
                                    display: true,
                                    text: '预测值',
                                    font: { size: 12, weight: 'bold' }
                                },
                                min: minVal,
                                max: maxVal
                            }
                        }
                    }
                });
            }

            // 2. 残差 vs 预测值
            const residualVsPredictedCtx = document.getElementById('residualVsPredictedChart');
            if (residualVsPredictedCtx) {
                const residuals = regViz.residuals_test;
                const yPred = regViz.y_pred_test;
                
                new Chart(residualVsPredictedCtx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: '残差',
                            data: yPred.map((val, idx) => ({x: val, y: residuals[idx]})),
                            backgroundColor: 'rgba(16, 185, 129, 0.6)',
                            borderColor: 'rgba(16, 185, 129, 1)',
                            borderWidth: 1,
                            pointRadius: 3
                        }, {
                            label: 'y=0 参考线',
                            data: [[Math.min(...yPred), 0], [Math.max(...yPred), 0]],
                            type: 'line',
                            borderColor: 'rgba(239, 68, 68, 1)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            fill: false,
                            pointRadius: 0,
                            tension: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        if (context.datasetIndex === 0) {
                                            return `残差: ${context.parsed.y.toFixed(4)}`;
                                        }
                                        return null;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: '预测值',
                                    font: { size: 11, weight: 'bold' }
                                }
                            },
                            y: {
                                title: {
                                display: true,
                                    text: '残差',
                                    font: { size: 11, weight: 'bold' }
                                }
                            }
                        }
                    }
                });
            }

            // 3. 残差分布直方图
            const residualDistributionCtx = document.getElementById('residualDistributionChart');
            if (residualDistributionCtx) {
                const residuals = regViz.residuals_test;
                
                // 计算直方图数据
                const bins = 15;
                const minResidual = Math.min(...residuals);
                const maxResidual = Math.max(...residuals);
                const binWidth = (maxResidual - minResidual) / bins;
                
                const histogram = new Array(bins).fill(0);
                const binLabels = [];
                residuals.forEach(residual => {
                    let binIdx = Math.floor((residual - minResidual) / binWidth);
                    if (binIdx >= bins) binIdx = bins - 1;
                    histogram[binIdx]++;
                });
                
                for (let i = 0; i < bins; i++) {
                    binLabels.push((minResidual + i * binWidth).toFixed(2));
                }
                
                new Chart(residualDistributionCtx, {
                    type: 'bar',
                    data: {
                        labels: binLabels,
                        datasets: [{
                            label: '频数',

                                    label: function(context) {

                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                title: {
                                    display: true,
                                    text: '残差值',

                                ticks: {
                                    maxRotation: 45,
                                    minRotation: 45
                                }
                            },
                            y: {
                                title: {
                                display: true,
                                    text: '频数',
                                    font: { size: 11, weight: 'bold' }
                                },
                                beginAtZero: true
                            }
                        }
                    }
                });
            }

            // 4. 回归系数可视化
            if (regViz.coefficients && regViz.coefficients.length > 0 && regViz.coefficients.length <= 10) {
                const coefficientsCtx = document.getElementById('coefficientsChart');
                if (coefficientsCtx) {
                    const coefficients = regViz.coefficients;
                    const featureNames = regViz.feature_names || coefficients.map((_, i) => `特征_${i+1}`);
                    
                    // 根据系数正负值设置不同颜色
                    const colors = coefficients.map(coef => 
                        coef >= 0 ? 'rgba(239, 68, 68, 0.7)' : 'rgba(59, 130, 246, 0.7)'
                    );
                    const borderColors = coefficients.map(coef => 
                        coef >= 0 ? 'rgba(239, 68, 68, 1)' : 'rgba(59, 130, 246, 1)'
                    );
                    
                    new Chart(coefficientsCtx, {
                        type: 'bar',
                        data: {
                            labels: featureNames,
                            datasets: [{
                                label: '回归系数',
                                data: coefficients,
                                backgroundColor: colors,
                                borderColor: borderColors,
                                borderWidth: 2
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: true,
                            indexAxis: 'y',
                            plugins: {
                                legend: {
                                    display: false
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            const value = context.parsed.x;
                                            const sign = value >= 0 ? '正向' : '负向';
                                            return `系数: ${value.toFixed(4)} (${sign}影响)`;
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: {
                                title: {
                                    display: true,
                                        text: '系数值',
                                        font: { size: 12, weight: 'bold' }
                                },
                                grid: {
                                        display: true,
                                        color: function(context) {
                                            if (context.tick.value === 0) {
                                                return 'rgba(0, 0, 0, 0.5)';
                                            }
                                            return 'rgba(0, 0, 0, 0.1)';
                                        }
                                    }
                                },
                                y: {
                                    title: {
                                        display: true,
                                        text: '特征',
                                        font: { size: 12, weight: 'bold' }
                                    }
                            }
                        }
                    }
                });
                }
            }
        }

        // ROC/PR曲线渲染函数
        function renderROCPRCurves(rocCurve, prCurve, results = null) {
            console.log('开始渲染ROC/PR曲线', {rocCurve, prCurve});
            
            // 保存results到全局变量，供阈值调整器使用
            if (results && results.threshold_data) {
                window.thresholdResults = results;
            }
            
            const rocCtx = document.getElementById('rocChart');
            const prCtx = document.getElementById('prChart');
            
            if (!rocCtx) {
                console.error('ROC图表容器未找到');
                // 再等一会儿重试
                setTimeout(() => {
                    const retryRocCtx = document.getElementById('rocChart');
                    if (retryRocCtx) {
                        console.log('重试渲染ROC曲线');
                        renderROCPRCurves(rocCurve, prCurve);
                    }
                }, 500);
                return;
            }
            
            if (!prCtx) {
                console.error('PR图表容器未找到');
                return;
            }
            
            if (!rocCurve || !prCurve) {
                console.error('ROC/PR曲线数据为空', {rocCurve, prCurve});
                return;
            }
            
            // 销毁之前的图表实例（如果存在）
            if (window.rocChartInstance) {
                window.rocChartInstance.destroy();
            }
            if (window.prChartInstance) {
                window.prChartInstance.destroy();
            }
            
            // ROC曲线
            if (rocCurve.multiclass) {
                // 多分类：为每个类别绘制一条曲线
                const datasets = [];
                const colors = [
                    'rgba(59, 130, 246, 0.8)',   // 蓝色
                    'rgba(16, 185, 129, 0.8)',   // 绿色
                    'rgba(239, 68, 68, 0.8)',    // 红色
                    'rgba(245, 158, 11, 0.8)',   // 橙色
                    'rgba(79, 195, 247, 0.8)'    // 天蓝色
                ];
                
                Object.keys(rocCurve.fpr).forEach((className, idx) => {
                    const fpr = rocCurve.fpr[className];
                    const tpr = rocCurve.tpr[className];
                    const auc = rocCurve.auc && rocCurve.auc[className] ? rocCurve.auc[className] : 0;
                    
                    if (!fpr || !tpr || fpr.length === 0 || tpr.length === 0) {
                        console.warn(`类别 ${className} 的ROC数据为空，跳过`);
                        return;
                    }
                    
                    // 确保数组长度一致
                    const minLen = Math.min(fpr.length, tpr.length);
                    const data = [];
                    for (let i = 0; i < minLen; i++) {
                        data.push({x: fpr[i], y: tpr[i]});
                    }
                    
                    datasets.push({
                        label: `${className} (AUC: ${auc.toFixed(3)})`,
                        data: data,
                        borderColor: colors[idx % colors.length],
                        backgroundColor: colors[idx % colors.length].replace('0.8', '0.1'),
                        borderWidth: 2,
                        fill: false,

                                    }
                                }

                                    min: 0, max: 1
                                },
                                y: {
                                    type: 'linear',

        // 动态阈值调整器初始化函数
        function initializeThresholdAdjuster(results) {
            if (!results.threshold_data) {
                console.warn('阈值数据不存在，无法初始化阈值调整器');
                return;
            }
            
            const thresholdData = results.threshold_data;
            const slider = document.getElementById('thresholdSlider');
            const thresholdValue = document.getElementById('thresholdValue');
            
            if (!slider || !thresholdValue) {
                console.warn('阈值调整器控件未找到');
                return;
            }
            
            // 初始化阈值滑块样式
            updateSliderStyle(slider, 0.5);
            
            // 初始更新
            updateThresholdVisualization(0.5, thresholdData, results);
            
            // 绑定滑块事件
            slider.addEventListener('input', function(e) {
                const threshold = parseFloat(e.target.value);
                thresholdValue.textContent = threshold.toFixed(2);
                updateSliderStyle(slider, threshold);
                updateThresholdVisualization(threshold, thresholdData, results);
            });
            
            console.log('动态阈值调整器初始化完成');
        }
        
        // 更新滑块样式（渐变色）
        function updateSliderStyle(slider, value) {
            const percentage = value * 100;
            slider.style.background = `linear-gradient(to right, #3B82F6 0%, #3B82F6 ${percentage}%, #94A3B8 ${percentage}%, #94A3B8 100%)`;
        }
        
        // 更新阈值可视化
        function updateThresholdVisualization(threshold, thresholdData, results) {
            const yTestBinary = thresholdData.y_test_binary;
            const yProba = thresholdData.y_proba;
            
            // 根据新阈值计算分类结果
            const yPred = yProba.map(p => p >= threshold ? 1 : 0);
            
            // 计算混淆矩阵
            let tp = 0, fp = 0, tn = 0, fn = 0;
            for (let i = 0; i < yTestBinary.length; i++) {
                if (yTestBinary[i] === 1 && yPred[i] === 1) tp++;
                else if (yTestBinary[i] === 0 && yPred[i] === 1) fp++;
                else if (yTestBinary[i] === 0 && yPred[i] === 0) tn++;
                else if (yTestBinary[i] === 1 && yPred[i] === 0) fn++;
            }
            
            // 计算指标
            const precision = tp + fp > 0 ? tp / (tp + fp) : 0;
            const recall = tp + fn > 0 ? tp / (tp + fn) : 0;
            const f1 = precision + recall > 0 ? 2 * (precision * recall) / (precision + recall) : 0;
            const accuracy = (tp + tn) / (tp + tn + fp + fn);
            
            // 更新指标显示
            document.getElementById('metricPrecision').textContent = precision.toFixed(4);
            document.getElementById('metricRecall').textContent = recall.toFixed(4);
            document.getElementById('metricF1').textContent = f1.toFixed(4);
            document.getElementById('metricAccuracy').textContent = accuracy.toFixed(4);
            
            // 更新混淆矩阵
            updateConfusionMatrix(tp, fp, tn, fn, thresholdData);
            
            // 更新ROC曲线上的阈值点
            updateROCThresholdPoint(threshold, results.roc_curve);
            
            // 更新概率分布图
            updateProbabilityDistribution(yProba, yTestBinary, threshold);
        }

        // 更新ROC曲线上的阈值点
        function updateROCThresholdPoint(threshold, rocCurve) {
            if (!window.rocChartInstance || rocCurve.multiclass) return;
            
            const fpr = rocCurve.fpr;
            const tpr = rocCurve.tpr;
            const thresholds = rocCurve.thresholds || [];
            
            // 找到最接近当前阈值的点
            let closestIdx = 0;
            let minDiff = Infinity;
            
            if (thresholds.length > 0) {
                for (let i = 0; i < thresholds.length; i++) {
                    const diff = Math.abs(thresholds[i] - threshold);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestIdx = i;
                    }
                }
            } else {
                // 如果没有thresholds，从y_proba中找到对应的FPR和TPR
                // 这需要在thresholdData中计算
                if (window.thresholdResults && window.thresholdResults.threshold_data) {
                    const yTestBinary = window.thresholdResults.threshold_data.y_test_binary;
                    const yProba = window.thresholdResults.threshold_data.y_proba;
                    
                    // 使用当前阈值计算TPR和FPR
                    const yPred = yProba.map(p => p >= threshold ? 1 : 0);
                    let tp = 0, fp = 0, tn = 0, fn = 0;
                    for (let i = 0; i < yTestBinary.length; i++) {
                        if (yTestBinary[i] === 1 && yPred[i] === 1) tp++;
                        else if (yTestBinary[i] === 0 && yPred[i] === 1) fp++;
                        else if (yTestBinary[i] === 0 && yPred[i] === 0) tn++;
                        else if (yTestBinary[i] === 1 && yPred[i] === 0) fn++;
                    }
                    
                    const currentFpr = (tn + fp) > 0 ? fp / (fp + tn) : 0;
                    const currentTpr = (tp + fn) > 0 ? tp / (tp + fn) : 0;
                    
                    // 更新图表
                    window.rocChartInstance.data.datasets[2].data = [{x: currentFpr, y: currentTpr}];
                    window.rocChartInstance.update('none'); // 'none' mode for smooth update
                    return;
                }
            }
            
            // 使用找到的索引
            if (closestIdx < fpr.length && closestIdx < tpr.length) {
                window.rocChartInstance.data.datasets[2].data = [{x: fpr[closestIdx], y: tpr[closestIdx]}];
                window.rocChartInstance.update('none');
            }
        }
        
        // 更新概率分布图
        function updateProbabilityDistribution(yProba, yTestBinary, threshold) {
            const ctx = document.getElementById('probabilityDistributionChart');
            if (!ctx) return;
            
            // 分离正类和负类的概率
            const positiveProbs = [];
            const negativeProbs = [];
            
            for (let i = 0; i < yProba.length; i++) {
                if (yTestBinary[i] === 1) {
                    positiveProbs.push(yProba[i]);
                } else {
                    negativeProbs.push(yProba[i]);
                }
            }
            
            // 创建直方图数据
            const bins = 20;
            const binSize = 1.0 / bins;
            const positiveHist = new Array(bins).fill(0);
            const negativeHist = new Array(bins).fill(0);
            
            positiveProbs.forEach(p => {
                const binIdx = Math.min(Math.floor(p / binSize), bins - 1);
                positiveHist[binIdx]++;
            });
            
            negativeProbs.forEach(p => {
                const binIdx = Math.min(Math.floor(p / binSize), bins - 1);
                negativeHist[binIdx]++;
            });
            
            // 归一化
            const maxCount = Math.max(...positiveHist, ...negativeHist);
            const normalizedPositive = positiveHist.map(x => x / maxCount);
            const normalizedNegative = negativeHist.map(x => -x / maxCount); // 负值用于显示在下方
            
            const labels = Array.from({length: bins}, (_, i) => ((i + 0.5) * binSize).toFixed(2));
            
            // 销毁旧图表
            if (window.probDistChartInstance) {
                window.probDistChartInstance.destroy();
            }
            
            // 找到阈值所在的bin位置
            const thresholdBinIdx = Math.min(Math.floor(threshold / binSize), bins - 1);
            const thresholdData = Array(bins).fill(null);
            thresholdData[thresholdBinIdx] = 1; // 在阈值位置标记
            
            window.probDistChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '正类样本',
                            data: normalizedPositive,
                            backgroundColor: 'rgba(16, 185, 129, 0.6)',
                            borderColor: 'rgba(16, 185, 129, 1)',
                            borderWidth: 1,
                            order: 2
                        },
                        {
                            label: '负类样本',
                            data: normalizedNegative,
                            backgroundColor: 'rgba(239, 68, 68, 0.6)',
                            borderColor: 'rgba(239, 68, 68, 1)',
                            borderWidth: 1,
                            order: 2
                        },
                        {
                            label: `阈值线 (${threshold.toFixed(2)})`,
                            data: [
                                {x: threshold, y: -1},
                                {x: threshold, y: 1}
                            ],
                            type: 'line',
                            borderColor: 'rgba(251, 191, 36, 1)',
                            backgroundColor: 'rgba(251, 191, 36, 0.1)',
                            borderWidth: 3,
                            pointRadius: 0,
                            fill: false,
                            borderDash: [8, 4],
                            tension: 0,
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { display: true, position: 'top' },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    if (context.datasetIndex === 2) {
                                        return `阈值: ${threshold.toFixed(2)}`;
                                    }
                                    const value = Math.abs(context.parsed.y * maxCount);
                                    return `${context.dataset.label}: ${value.toFixed(0)}个样本`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            title: { display: true, text: '预测概率', font: { size: 11, weight: 'bold' } },
                            min: 0,
                            max: 1,
                            position: 'bottom'
                        },
                        y: {
                            title: { display: true, text: '样本数量（归一化）', font: { size: 11, weight: 'bold' } },
                            min: -1,
                            max: 1,
                            ticks: {
                                callback: function(value) {
                                    return Math.abs(value).toFixed(1);
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderSVMDecisionBoundary(dbData) {
            console.log('开始渲染SVM决策边界', dbData);
            const ctx = document.getElementById('svmDecisionBoundaryChart');
            if (!ctx) {
                console.warn('SVM决策边界图表容器未找到');
                return;
            }
            
            const xx = dbData.xx;
            const yy = dbData.yy;
            const Z = dbData.Z;
            const X_train = dbData.X_train || [];
            const y_train = dbData.y_train || [];
            const support_vectors = dbData.support_vectors || [];
            const feature_names = dbData.feature_names || ['特征1', '特征2'];
            const target_names = dbData.target_names || ['类别0', '类别1'];
            
            // 准备数据点
            const unique_classes = [...new Set(y_train)];
            const datasets = [];
            
            // 为每个类别创建数据集
            unique_classes.forEach((classLabel, classIdx) => {
                const classPoints = X_train.filter((_, idx) => y_train[idx] === classLabel);
                if (classPoints.length > 0) {
                    datasets.push({
                        label: target_names[classIdx] || `类别${classLabel}`,
                        data: classPoints.map(p => ({x: p[0], y: p[1]})),
                        backgroundColor: [
                            'rgba(239, 68, 68, 0.6)',   // 红色
                            'rgba(59, 130, 246, 0.6)',  // 蓝色
                            'rgba(16, 185, 129, 0.6)',  // 绿色
                            'rgba(245, 158, 11, 0.6)',  // 橙色
                            'rgba(79, 195, 247, 0.6)'   // 天蓝色
                        ][classIdx % 5],
                        borderColor: [
                            'rgba(239, 68, 68, 1)',
                            'rgba(59, 130, 246, 1)',
                            'rgba(16, 185, 129, 1)',
                            'rgba(245, 158, 11, 1)',
                            'rgba(79, 195, 247, 1)'
                        ][classIdx % 5],
                        pointRadius: 5,
                        borderWidth: 1
                    });
                }
            });
            
            // 添加支持向量（用特殊标记）
            support_vectors.forEach((svGroup, svIdx) => {
                const svPoints = svGroup.vectors || [];
                if (svPoints.length > 0) {
                    datasets.push({
                        label: `支持向量${svIdx + 1 > 1 ? ` (${svIdx + 1})` : ''}`,
                        data: svPoints.map(p => ({x: p[0], y: p[1]})),
                        backgroundColor: 'rgba(251, 191, 36, 0.8)',
                        borderColor: 'rgba(251, 191, 36, 1)',
                        pointRadius: 8,
                        borderWidth: 2,
                        pointStyle: 'star'
                    });
                }
            });
            
            // 销毁旧图表
            if (window.svmDecisionBoundaryChart) {
                try {
                    window.svmDecisionBoundaryChart.destroy();
                } catch (e) {
                    console.warn('销毁旧图表失败:', e);
                }
            }
            
            // 创建图表
            try {
                // 创建插件实例（每次创建新的，避免变量作用域问题）
                const decisionBoundaryPlugin = {
                    id: `decisionBoundary_${Date.now()}`,
                    beforeDatasetsDraw: function(chart) {
                        if (!chart._decisionBoundaryData) return;
                        
                        const { Z, xx, yy } = chart._decisionBoundaryData;
                        const ctx = chart.ctx;
                        const xScale = chart.scales.x;
                        const yScale = chart.scales.y;
                        
                        // 绘制背景色区域（根据Z值填充不同颜色）
                        if (Array.isArray(Z) && Array.isArray(Z[0]) && Array.isArray(xx) && Array.isArray(yy)) {
                            const rows = Z.length;
                            const cols = Z[0].length;
                            
                            // 获取唯一类别数
                            const uniqueZ = [...new Set(Z.flat())];
                            const colorMap = {
                                0: 'rgba(239, 68, 68, 0.1)',    // 红色（浅）
                                1: 'rgba(59, 130, 246, 0.1)',   // 蓝色（浅）
                                2: 'rgba(16, 185, 129, 0.1)',   // 绿色（浅）
                                3: 'rgba(245, 158, 11, 0.1)',   // 橙色（浅）
                                4: 'rgba(79, 195, 247, 0.1)'    // 天蓝色（浅）
                            };
                            
                            // 绘制每个网格单元的背景色
                            for (let i = 0; i < rows - 1; i++) {
                                for (let j = 0; j < cols - 1; j++) {
                                    const zVal = Math.round(Z[i][j]);
                                    const color = colorMap[zVal] || 'rgba(200, 200, 200, 0.1)';
                                    
                                    const x1 = xScale.getPixelForValue(xx[i][j]);
                                    const y1 = yScale.getPixelForValue(yy[i][j]);
                                    const x2 = xScale.getPixelForValue(xx[i][j + 1]);
                                    const y2 = yScale.getPixelForValue(yy[i + 1][j]);
                                    
                                    ctx.fillStyle = color;
                                    ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
                                }
                            }
                            
                            // 绘制决策边界线（类别边界）
                            ctx.strokeStyle = 'rgba(0, 0, 0, 0.5)';
                            ctx.lineWidth = 2;
                            
                            for (let i = 0; i < rows - 1; i++) {
                                for (let j = 0; j < cols - 1; j++) {
                                    const z00 = Math.round(Z[i][j]);
                                    const z01 = Math.round(Z[i][j + 1]);
                                    const z10 = Math.round(Z[i + 1][j]);
                                    
                                    // 检查水平边界
                                    if (z00 !== z01) {
                                        const x = xScale.getPixelForValue(xx[i][j + 1]);
                                        const y1 = yScale.getPixelForValue(yy[i][j]);
                                        const y2 = yScale.getPixelForValue(yy[i + 1][j]);
                                        
                                        ctx.beginPath();
                                        ctx.moveTo(x, y1);
                                        ctx.lineTo(x, y2);
                                        ctx.stroke();
                                    }
                                    
                                    // 检查垂直边界
                                    if (z00 !== z10) {
                                        const x1 = xScale.getPixelForValue(xx[i][j]);
                                        const x2 = xScale.getPixelForValue(xx[i][j + 1]);
                                        const y = yScale.getPixelForValue(yy[i + 1][j]);
                                        
                                        ctx.beginPath();
                                        ctx.moveTo(x1, y);
                                        ctx.lineTo(x2, y);
                                        ctx.stroke();
                                    }
                                }
                            }
                        }
                    }
                };
                
                window.svmDecisionBoundaryChart = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: datasets
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            title: {
                                display: true,
                                text: `SVM决策边界 (${dbData.kernel || 'rbf'}核)`,
                                font: { size: 14, weight: 'bold' }
                            },
                            legend: {
                                display: true,
                                position: 'right'
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        return `${context.dataset.label}: (${context.parsed.x.toFixed(2)}, ${context.parsed.y.toFixed(2)})`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: {
                                type: 'linear',
                                title: {
                                    display: true,
                                    text: feature_names[0] || '特征1',
                                    font: { size: 12, weight: 'bold' }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            },
                            y: {
                                type: 'linear',
                                title: {
                                    display: true,
                                    text: feature_names[1] || '特征2',
                                    font: { size: 12, weight: 'bold' }
                                },
                                grid: {
                                    color: 'rgba(0, 0, 0, 0.05)'
                                }
                            }
                        }
                    },
                    plugins: [decisionBoundaryPlugin]
                });
                
                // 将数据存储到图表实例中，供插件使用
                window.svmDecisionBoundaryChart._decisionBoundaryData = { Z, xx, yy };
                
                window.svmDecisionBoundaryChart.update();
                console.log('SVM决策边界图表创建成功');
            } catch (error) {
                console.error('创建SVM决策边界图表失败:', error);
            }
        }
        
        // KNN K值选择曲线渲染函数
        function renderKNNKSelection(kSelectionData) {
            console.log('开始渲染KNN K值选择曲线', kSelectionData);
            const ctx = document.getElementById('knnKSelectionChart');
            if (!ctx) {
                console.warn('KNN K值选择曲线图表容器未找到');
                return;
            }
            
            const kValues = kSelectionData.k_values || [];
            const performance = kSelectionData.performance || [];
            const taskType = kSelectionData.task_type || 'classification';
            const bestK = kSelectionData.best_k;
            
            if (kValues.length === 0 || performance.length === 0) {
                console.warn('K值选择数据为空');
                return;
            }
            
            // 准备数据
            let metricName, metricValues, stdValues;
            if (taskType === 'classification') {
                metricName = '准确率';
                metricValues = performance.map(p => p.accuracy || 0);
                stdValues = performance.map(p => p.std || 0);
            } else {
                metricName = 'RMSE';
                metricValues = performance.map(p => p.rmse || 0);
                stdValues = performance.map(p => p.std || 0);

            // 销毁旧图表
